<style>
  #net { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: .75; }
  section { padding: 110px 0; position: relative; scroll-margin-top: var(--top-h); }

  .sec-head { text-align: center; max-width: 720px; margin: 0 auto 56px; }

  .eyebrow .no { color: var(--muted); }

  /* ---------- hero ---------- */
  .hero { position: relative; padding: calc(var(--top-h) + 80px) 0 100px; overflow: hidden; min-height: 100vh; display: flex; align-items: center; }

  }

  @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-30px); } }

  .tag {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 14px; color: var(--cyan);
    border: 1px solid rgba(34, 211, 238, .35); background: rgba(34, 211, 238, .08); margin-bottom: 22px;
  }
  .tag i { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 0 rgba(52, 211, 153, .7); animation: ping 2s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.6); } 80%,100% { box-shadow: 0 0 0 10px rgba(52,211,153,0); } }
  .hello { font: 500 15px var(--mono); color: var(--muted); }
  .hello b { color: var(--cyan); font-weight: 600; }
  .hero h1 { font-size: 72px; line-height: 1.1; font-weight: 800; letter-spacing: 2px; margin-top: 8px; }
  .hero h1 small { font-size: 26px; letter-spacing: 1px; margin-left: 16px; font-weight: 700; vertical-align: middle; }
  html[lang="en"] .hero h1 { letter-spacing: -1px; }
  .typed { font-size: 21px; line-height: 1.55; margin: 20px 0 0; min-height: 1.6em; max-width: 680px; color: #dbe3ff; }
  .typed .caret { display: inline-block; width: 2px; height: 1.05em; margin-left: 3px; vertical-align: -3px; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .edu-line { margin-top: 12px; color: var(--muted); font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px 18px; }

  .hskills { margin-top: 26px; max-width: 660px; }
  .hskills .lab { font: 600 12.5px var(--mono); color: var(--muted); letter-spacing: 2px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .hskills .lab::after { content: ""; flex: 1; max-width: 120px; height: 1px; background: linear-gradient(90deg, var(--line2), transparent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 11px; font-size: 14px; color: #cdd6f2;
    border: 1px solid var(--line2); background: rgba(255, 255, 255, .035); white-space: nowrap;
  }

  .pf-wrap { position: relative; justify-self: center; width: 290px; max-width: 100%; }
  .pf-wrap::before {
    content: ""; position: absolute; width: 420px; height: 460px; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(59,130,255,.32), transparent 65%); filter: blur(30px); pointer-events: none;
  }
  .pf { position: relative; border-radius: 26px; padding: 1.5px; overflow: hidden; background: rgba(140, 170, 255, .22); box-shadow: 0 30px 70px rgba(0,0,0,.5); }
  .pf::before {
    content: ""; position: absolute; inset: -50%; animation: spin 9s linear infinite;
    background: conic-gradient(from 0deg, transparent 0 58%, rgba(59,130,255,.9) 72%, rgba(34,211,238,.95) 84%, transparent 100%);
  }
  @keyframes spin { to { transform: rotate(1turn); } }
  .pf-in { position: relative; border-radius: 24.5px; padding: 12px; background: linear-gradient(165deg, #121a36, #0a1022 70%); }
  .pf-photo { position: relative; aspect-ratio: 5 / 5.6; border-radius: 17px; overflow: hidden; background: #eef3fb; }
  .pf-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; display: block; }
  .pf-photo::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
    background: radial-gradient(120% 70% at 50% 0%, rgba(205, 222, 255, .55), transparent 60%), linear-gradient(180deg, transparent 75%, rgba(196, 214, 245, .45));
  }
  .pf-photo .scan {
    position: absolute; left: 0; right: 0; height: 28%; top: -30%; z-index: 1; pointer-events: none;

  }
  @keyframes scan { 0% { top: -30%; } 60%,100% { top: 100%; } }
  .pf-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 12px; text-align: center; }

  .pf-stats b { display: block; font: 800 17px var(--mono); }
  .pf-stats span { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.35; margin-top: 2px; }
  .corner { position: absolute; width: 22px; height: 22px; border: 2px solid var(--cyan); z-index: 2; }
  .corner.tl { top: -11px; left: -11px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
  .corner.br { bottom: -11px; right: -11px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }
  .badge {
    position: absolute; z-index: 3; padding: 9px 14px; border-radius: 14px; font-size: 13px; white-space: nowrap; text-align: left;
    background: rgba(11, 17, 36, .82); border: 1px solid var(--line2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 12px 30px rgba(0,0,0,.4); animation: bob 6s ease-in-out infinite;
  }
  .badge b { display: block; font: 800 18px var(--mono); }

  .badge.b2 { right: -52px; top: 52%; animation-delay: -3s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .scroll-hint { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); color: var(--muted); font: 12px var(--mono); letter-spacing: 3px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .scroll-hint i { width: 1px; height: 34px; background: linear-gradient(var(--cyan), transparent); animation: drop 2s ease-in-out infinite; transform-origin: top; }
  @keyframes drop { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

  /* ---------- skills ---------- */
  .sk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .skc { padding: 28px 24px 26px; display: flex; flex-direction: column; gap: 14px; }
  .skc:hover { transform: translateY(-4px); }
  .skc-h { display: flex; align-items: center; gap: 12px; }
  .skc-h .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(59,130,255,.14); flex: none; }
  .skc-h .ic svg { width: 21px; height: 21px; }
  .skc-h h3 { font-size: 18px; line-height: 1.3; }
  .skc-big { padding: 14px 0 12px; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); }
  .skc-big b { display: block; font-size: 38px; line-height: 1.1; font-weight: 800; letter-spacing: -.5px; white-space: nowrap; }
  .skc-big b small { font-size: 20px; font-weight: 700; margin-left: 2px; }
  .skc-big span { display: block; color: #cdd6f2; font-size: 14px; margin-top: 4px; }
  .skc .tags span { font-family: inherit; font-size: 13px; color: #cfd8f2; }
  .skc p { color: var(--muted); font-size: 14px; line-height: 1.7; margin-top: auto; }

  /* ---------- about ---------- */
  .about { display: flex; flex-direction: column; gap: 22px; }
  .intro { padding: 30px 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 34px; align-items: center; }
  .intro p { font-size: 18px; color: #dbe3ff; line-height: 1.85; }
  .spec { font: 13.5px/1.9 var(--mono); padding: 18px 20px; border-radius: 16px; background: rgba(0, 0, 0, .28); border: 1px solid var(--line); }
  .spec .dots { display: flex; gap: 6px; margin-bottom: 10px; }
  .spec .dots i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; }
  .spec .dots i:nth-child(2) { background: #febc2e; } .spec .dots i:nth-child(3) { background: #28c840; }
  .spec .row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; }
  .spec .k { color: var(--cyan); }
  .spec .v { color: #dbe3ff; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 14px; }

  .str .ic svg { width: 24px; height: 24px; }

  /* ---------- numbers ---------- */
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .num { padding: 28px 24px 24px; overflow: hidden; }
  .num b { display: block; font-size: 40px; line-height: 1.15; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.5px; white-space: nowrap; }
  .num b small { font-size: 22px; font-weight: 700; }
  .num > span { display: block; color: var(--muted); font-size: 14px; margin-top: 8px; }
  .num .src { display: block; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font: 12px var(--mono); color: #7f8bb0; }
  .num::before { content: ""; position: absolute; left: 24px; top: 0; width: 36px; height: 2px; background: var(--grad); box-shadow: 0 0 12px var(--cyan); }

  /* ---------- timeline ---------- */
  .tl { position: relative; max-width: 980px; margin: 0 auto; padding-left: 64px; }

  .tl .rail i { position: absolute; left: 0; top: 0; width: 100%; height: 0; background: var(--grad); border-radius: 2px; box-shadow: 0 0 12px rgba(34,211,238,.6); }
  .job { position: relative; padding: 30px 32px; margin-bottom: 26px; }
  .job .dot { position: absolute; left: -53px; top: 34px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg); border: 2px solid var(--cyan); box-shadow: 0 0 0 5px rgba(34,211,238,.12), 0 0 18px rgba(34,211,238,.5); }
  .job .dot::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--grad); }
  .job-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: baseline; }

  .date { font: 600 13px var(--mono); color: var(--muted); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.03); white-space: nowrap; }
  .job ul { margin-top: 16px; }
  .job li { list-style: none; position: relative; padding-left: 20px; margin: 9px 0; color: #ccd5ef; font-size: 15.5px; }
  .job li::before { content: ""; position: absolute; left: 2px; top: .68em; width: 7px; height: 7px; border-radius: 2px; background: var(--grad); transform: rotate(45deg); }
  .metrics { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .metrics span { padding: 7px 12px; border-radius: 12px; background: rgba(59,130,255,.1); border: 1px solid rgba(59,130,255,.25); font-size: 13px; color: var(--muted); }
  .metrics b { color: var(--text); font-family: var(--mono); margin-left: 6px; }

  /* ---------- works ---------- */
  .works { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .work { display: flex; flex-direction: column; overflow: hidden; }
  .work:hover { transform: translateY(-6px); }
  .work .vis { position: relative; aspect-ratio: 16 / 9.4; overflow: hidden; border-bottom: 1px solid var(--line); }
  .work .vis img { display: block; }
  .vis-psync img.poster { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  .work:hover .vis-psync img.poster { transform: scale(1.04); }
  .vis-psync .play { position: absolute; left: 18px; bottom: 16px; display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; background: rgba(6,9,20,.78); border: 1px solid var(--line2); backdrop-filter: blur(8px); }
  .vis-ielts { background: radial-gradient(circle at 50% 120%, rgba(34,211,238,.35), transparent 60%), linear-gradient(160deg, #0f1a3a, #081022); display: flex; justify-content: center; align-items: flex-start; padding-top: 26px; }
  .vis-ielts .ph { width: 27%; border-radius: 18px; padding: 4px; background: linear-gradient(145deg, #2a3045, #0d1020); box-shadow: 0 20px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.08); transition: transform .5s; }
  .vis-ielts .ph img { width: 100%; aspect-ratio: 414 / 900; object-fit: cover; border-radius: 14px; }
  .vis-ielts .ph:nth-child(1) { transform: translate(18%, 26px) rotate(-7deg); }
  .vis-ielts .ph:nth-child(2) { z-index: 2; width: 31%; }
  .vis-ielts .ph:nth-child(3) { transform: translate(-18%, 26px) rotate(7deg); }
  .work:hover .vis-ielts .ph:nth-child(1) { transform: translate(8%, 18px) rotate(-10deg); }
  .work:hover .vis-ielts .ph:nth-child(3) { transform: translate(-8%, 18px) rotate(10deg); }
  .work .body { padding: 28px 30px 30px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .work .ttl { display: flex; align-items: center; gap: 14px; }
  .work .ttl img { width: 48px; height: 48px; border-radius: 13px; }
  .work h3 { font-size: 24px; line-height: 1.25; }
  .work .subt { color: var(--muted); font-size: 14px; }
  .work .meta { font: 12.5px var(--mono); color: var(--cyan); letter-spacing: .5px; }
  .work p.sum { color: #d0d8f0; font-size: 15.5px; }
  .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mini div { padding: 12px 14px; border-radius: 14px; background: rgba(0,0,0,.22); border: 1px solid var(--line); }
  .mini b { display: block; font: 800 19px var(--mono); }
  .mini span { font-size: 12.5px; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tags span { font: 12.5px var(--mono); padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: #b9c6ea; }
  .work .go { margin-top: auto; padding-top: 6px; display: flex; align-items: center; gap: 8px; color: var(--cyan); font-weight: 600; }
  .work .go i { font-style: normal; transition: transform .3s; }
  .work:hover .go i { transform: translateX(6px); }

  /* ---------- campus ---------- */
  .camp { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .comp { padding: 30px 30px 28px; display: flex; flex-direction: column; gap: 12px; }
  .comp .role { font: 600 12.5px var(--mono); color: var(--cyan); letter-spacing: 1px; }
  .comp h3 { font-size: 20px; line-height: 1.4; }
  .comp li { list-style: none; position: relative; padding-left: 18px; margin: 7px 0; color: #ccd5ef; font-size: 15px; }
  .comp li::before { content: "▹"; position: absolute; left: 0; color: var(--cyan); }
  .award { margin-top: auto; display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #fde68a; background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.3); }

  /* ---------- education / honors / skills ---------- */
  .edu-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 24px; }

  .courses { display: flex; flex-wrap: wrap; gap: 8px; }
  .courses span { font-size: 13.5px; padding: 6px 12px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid var(--line); color: #cfd8f2; }

  /* ---------- contact ---------- */
  .contact { text-align: center; padding: 120px 0 110px; }
  .contact h2 { font-size: 50px; font-weight: 800; line-height: 1.2; margin-top: 14px; }
  .contact p { color: var(--muted); font-size: 18px; margin: 16px auto 0; max-width: 640px; }
  .mail { display: inline-flex; align-items: center; gap: 12px; margin-top: 34px; padding: 16px 28px; border-radius: 18px; font: 600 20px var(--mono); border: 1px solid rgba(34,211,238,.4); background: rgba(34,211,238,.07); transition: all .3s; }
  .mail:hover { background: rgba(34,211,238,.14); box-shadow: 0 0 40px rgba(34,211,238,.25); }

  .contact .cta { justify-content: center; }

  @media (max-width: 1080px) {
    .nums, .sk { grid-template-columns: repeat(2, 1fr); }
    .strengths { grid-template-columns: repeat(2, 1fr); }
    .intro { grid-template-columns: 1fr; gap: 20px; }

/* ---------- 数字滚动 ---------- */
function bindCounters() {
  document.querySelectorAll('.num').forEach(card => card.addEventListener('reveal', () => {
    const el = card.querySelector('.cnt'), to = +el.dataset.n;
    if (CALM || el.dataset.done) { el.textContent = fmt(to); return; }
    el.dataset.done = 1;
    const t0 = performance.now(), dur = 1500;
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur);
      el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - k, 3))));
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, { once: true }));
}

/* ---------- 打字机 ---------- */
let typeTimer;
function typeTagline(text) {
  const el = $('typed');
  clearTimeout(typeTimer);
  if (CALM) { el.textContent = text; return; }
  const chars = [...text];
  let i = 0;
  el.textContent = '';
  const step = () => {
    el.textContent = chars.slice(0, ++i).join('');
    if (i < chars.length) typeTimer = setTimeout(step, /[，。,.]/.test(chars[i - 1]) ? 260 : (chars.length > 50 ? 32 : 70));
  };
  typeTimer = setTimeout(step, 500);
}

/* ---------- 时间轴进度 ---------- */
function updateRail() {
  const tl = $('tl'), fill = $('tlFill');
  if (!tl) return;
  if (STATIC) { fill.style.height = '100%'; return; }
  const r = tl.getBoundingClientRect();
  const k = Math.max(0, Math.min(1, (innerHeight * .65 - r.top) / r.height));
  fill.style.height = (k * 100) + '%';
}
addEventListener('scroll', updateRail, { passive: true });

/* ---------- 语言 ---------- */
let rendered = false;
const qsLang = (location.search.match(/[?&]lang=(zh|en)\b/) || [])[1];
let LANG = qsLang || (() => { try { return localStorage.getItem('lang'); } catch (e) { return null; } })() || 'zh';
if (!UI[LANG]) LANG = 'zh';
render(LANG);
$('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('lang', LANG); } catch (e) {}
  render(LANG);
});

/* ---------- 粒子连线背景 ---------- */
(function net() {
  const cv = $('net'), ctx = cv.getContext('2d');
  let W, H, dpr, pts = [], mouse = { x: -1e4, y: -1e4 }, raf;
  function size() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(90, W * H / 16000));
    pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35, r: Math.random() * 1.6 + .6 }));
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    const D = 130;
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    }
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      for (let j = i + 1; j < pts.length; j++) {
        const b = pts[j], dx = a.x - b.x, dy = a.y - b.y, dd = dx * dx + dy * dy;
        if (dd < D * D) {
          ctx.strokeStyle = `rgba(110,150,255,${(1 - Math.sqrt(dd) / D) * .28})`;
          ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      const mx = a.x - mouse.x, my = a.y - mouse.y, md = mx * mx + my * my;
      if (md < 180 * 180) {
        ctx.strokeStyle = `rgba(34,211,238,${(1 - Math.sqrt(md) / 180) * .55})`;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(150,185,255,.75)';
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.283); ctx.fill();
    }
  }
  function loop() { frame(); raf = requestAnimationFrame(loop); }
  size();
  if (CALM) { frame(); addEventListener('resize', () => { size(); frame(); }); return; }
  addEventListener('resize', size);
  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  document.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1e4; });
  document.addEventListener('visibilitychange', () => { cancelAnimationFrame(raf); if (!document.hidden) loop(); });
  loop();
})();
</script>
